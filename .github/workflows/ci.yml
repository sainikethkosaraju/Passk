name: ci
on: [push, pull_request]
jobs:
  core:                      # zero-dependency core must work without Inspect
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.10", "3.11", "3.12", "3.13"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e . pytest hypothesis zstandard opentelemetry-sdk pyyaml
      - run: pytest -q --ignore=tests/test_inspect_integration.py --ignore=tests/test_importer.py
  inspect:                   # real Inspect: cross-validation, record/replay, importer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,inspect]"
      - run: ruff check . && pyright
      - run: pytest -q
  calibration:               # re-runs the Monte-Carlo calibration (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: python scripts/coverage_sim.py 200
