name: collect
# Live trials within free-tier limits. Secrets: NVIDIA_API_KEY. Never runs on pull requests.
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PASSK_RPM: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . inspect-ai openai
      - name: Skip cleanly without a key
        run: test -n "$NVIDIA_API_KEY" || { echo "NVIDIA_API_KEY not set; skipping"; exit 0; }
      - run: |
          test -z "$NVIDIA_API_KEY" && exit 0
          inspect eval examples/tiny_task.py --model openai/openai/gpt-oss-120b \
            --model-base-url https://integrate.api.nvidia.com/v1 \
            -M api_key=$NVIDIA_API_KEY --epochs 5 --max-connections 1 \
            --log-dir collected --log-format json
      - uses: peter-evans/create-pull-request@v6
        with: { branch: collect/nightly, title: "chore: nightly collected logs" }
